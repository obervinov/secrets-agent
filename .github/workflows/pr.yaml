---
name: PR

on:
  push:
    branches: ['*', '*/*', '**', '!main']

# Scoped for the reusable workflows: PR body updates and lint/test reporting.
permissions:
  contents: write
  pull-requests: write
  security-events: write
  actions: write
  checks: read

jobs:
  pr:
    uses: obervinov/_templates/.github/workflows/pr.yaml@v3.7.0

  golang:
    uses: obervinov/_templates/.github/workflows/golang.yaml@v3.7.0

  # Runs here too, so a PR proves the cross-compilation works; the upload step
  # inside it is skipped off the default branch.
  binaries:
    uses: obervinov/_templates/.github/workflows/golang-binaries.yaml@v3.7.0
    needs: [golang]
